[build-system]
requires = ["setuptools>=69.0", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "sniper-bot-solana"
version = "0.1.0"
description = "Solana Confirmation Sniper Bot MVP scaffold (record/paper first release)"
requires-python = ">=3.12"
dependencies = [
  "aiofiles>=24.1.0",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "prometheus-client>=0.21.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "structlog>=24.2.0",
  "uvloop>=0.21.0; sys_platform != 'win32'",
  "uvicorn[standard]>=0.30.0",
  "websockets>=14.0,<16.0",
  "zstandard>=0.23.0",
  "python-dateutil>=2.9.0",
  "tzdata>=2025.2",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21.0",
  "hypothesis>=6.122.0",
  "mypy>=1.14.0",
  "pre-commit>=4.0.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "solders>=0.23.0",
]

[project.scripts]
sniper-bot = "sniper_bot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend-exclude = [".runtime"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["src"]
