services:
  migrate:
    build: .
    environment:
      MIGRATION_POSTGRES_DSN: ${MIGRATION_POSTGRES_DSN:?MIGRATION_POSTGRES_DSN is required}
      SNIPER_DB_USER: ${SNIPER_DB_USER:?SNIPER_DB_USER is required}
    command: ["/bin/sh", "-ec", "python -m alembic upgrade head && python scripts/grant_app_role.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  sniper-bot:
    build: .
    environment:
      APP_MODE: ${APP_MODE:?APP_MODE is required}
      APP_REVISION: ${APP_REVISION:?APP_REVISION is required}
      TIME_ZONE: ${TIME_ZONE:-Europe/Kyiv}
      HELIUS_API_KEY: ${HELIUS_API_KEY:?HELIUS_API_KEY is required}
      HELIUS_WSS_URL: ${HELIUS_WSS_URL:-}
      HELIUS_RPC_URL: ${HELIUS_RPC_URL:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:?JUPITER_API_KEY is required}
      POSTGRES_DSN: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:?TELEGRAM_ADMIN_CHAT_ID is required}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-[]}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-[]}
      STARTING_EQUITY_USD: ${STARTING_EQUITY_USD:-500}
      BASE_QUOTE_MINT: ${BASE_QUOTE_MINT:-EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}
      BASE_QUOTE_DECIMALS: ${BASE_QUOTE_DECIMALS:-6}
      JUPITER_REPLAY_MODE: ${JUPITER_REPLAY_MODE:-false}
      JUPITER_QUOTE_JOURNAL_PATH: ${JUPITER_QUOTE_JOURNAL_PATH:-./data/jupiter_quotes.ndjson}
      JUPITER_QUOTE_JOURNAL_RECORD: ${JUPITER_QUOTE_JOURNAL_RECORD:-false}
      CONFIG_PATH: ${CONFIG_PATH:-configs/default.yaml}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - bot-data:/app/data
    read_only: true
    tmpfs:
      - /app/tmp:size=64m,mode=1777
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      SNIPER_DB_USER: ${SNIPER_DB_USER:?SNIPER_DB_USER is required}
      SNIPER_DB_PASSWORD: ${SNIPER_DB_PASSWORD:?SNIPER_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-sniper-role.sh:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: postgres:16
    environment:
      MIGRATION_POSTGRES_DSN: ${MIGRATION_POSTGRES_DSN:?MIGRATION_POSTGRES_DSN is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          /bin/sh /scripts/backup.sh
          sleep 86400
        done
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  bot-data:
  pg-data:
  backups:
