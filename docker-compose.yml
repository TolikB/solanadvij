services:
  migrate:
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:?APP_REVISION is required}
    environment:
      MIGRATION_POSTGRES_DSN: ${MIGRATION_POSTGRES_DSN:?MIGRATION_POSTGRES_DSN is required}
      SNIPER_DB_USER: ${SNIPER_DB_USER:?SNIPER_DB_USER is required}
    command: ["/bin/sh", "-ec", "python -m alembic upgrade head && python scripts/grant_app_role.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  sniper-bot:
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:?APP_REVISION is required}
    # The config file is chosen per run (configs/calibration.yaml only for the
    # record-mode calibration soak); the image default stays configs/default.yaml.
    command:
      - sniper-bot
      - --config
      - ${CONFIG_PATH:-configs/default.yaml}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    stop_grace_period: 180s
    environment:
      APP_MODE: ${APP_MODE:?APP_MODE is required}
      APP_REVISION: ${APP_REVISION:?APP_REVISION is required}
      TIME_ZONE: ${TIME_ZONE:-Europe/Kyiv}
      HELIUS_API_KEY: ${HELIUS_API_KEY:?HELIUS_API_KEY is required}
      HELIUS_WSS_URL: ${HELIUS_WSS_URL:-}
      HELIUS_RPC_URL: ${HELIUS_RPC_URL:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:?JUPITER_API_KEY is required}
      POSTGRES_DSN: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:?TELEGRAM_ADMIN_CHAT_ID is required}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-[]}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-[]}
      TELEGRAM: "${TELEGRAM:?TELEGRAM is required}"
      # Operational override for chain settings, applied without rebuilding the
      # image: configs/ is baked in, so a stale-checkpoint reset during an
      # incident has to be switchable from .env.
      CHAIN: "${CHAIN:-}"
      # End of the frozen statistical window, written by
      # scripts/freeze_statistical_protocol.py collection-env. Part of the
      # config hash: set it before freezing the protocol, never during it.
      COLLECTION: "${COLLECTION:-}"
      PROVIDERS: "${PROVIDERS:-}"
      STARTING_EQUITY_USD: ${STARTING_EQUITY_USD:-500}
      BASE_QUOTE_MINT: ${BASE_QUOTE_MINT:-EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}
      BASE_QUOTE_DECIMALS: ${BASE_QUOTE_DECIMALS:-6}
      JUPITER_REPLAY_MODE: ${JUPITER_REPLAY_MODE:-false}
      JUPITER_QUOTE_JOURNAL_PATH: ${JUPITER_QUOTE_JOURNAL_PATH:-./data/jupiter_quotes.ndjson}
      JUPITER_QUOTE_JOURNAL_RECORD: ${JUPITER_QUOTE_JOURNAL_RECORD:-false}
      CONFIG_PATH: ${CONFIG_PATH:-configs/default.yaml}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - bot-data:/app/data
    read_only: true
    tmpfs:
      - /app/tmp:size=64m,mode=1777
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Continuous soak gate against the running bot. Results are JSON lines in
  # this service's rotated log; nothing is sent to Telegram.
  monitor:
    image: python:3.12-slim
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python /monitor/soak_check.py --base-url http://sniper-bot:8080 \
            --duration "$${MONITOR_WINDOW_SECONDS:-600}" --interval 15 \
            --label monitor --no-candidates \
            --disk-path /monitor/volumes/bot-data \
            --disk-path /monitor/volumes/backups || true
        done
    environment:
      MONITOR_WINDOW_SECONDS: ${MONITOR_WINDOW_SECONDS:-600}
      # Optional dead-man's switch (e.g. a healthchecks.io check URL): pinged
      # after every passing window, /fail after a failing one, silent when
      # the bot or the host is down.
      MONITOR_HEARTBEAT_URL: ${MONITOR_HEARTBEAT_URL:-}
    volumes:
      - ./scripts/soak_check.py:/monitor/soak_check.py:ro
      - bot-data:/monitor/volumes/bot-data:ro
      - backups:/monitor/volumes/backups:ro
    depends_on:
      sniper-bot:
        condition: service_started
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      SNIPER_DB_USER: ${SNIPER_DB_USER:?SNIPER_DB_USER is required}
      SNIPER_DB_PASSWORD: ${SNIPER_DB_PASSWORD:?SNIPER_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-sniper-role.sh:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: postgres:16
    environment:
      MIGRATION_POSTGRES_DSN: ${MIGRATION_POSTGRES_DSN:?MIGRATION_POSTGRES_DSN is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          /bin/sh /scripts/backup.sh
          sleep 86400
        done
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Off-host copies of the nightly database dumps and the raw event archive.
  # Enabled with `--profile offsite` once OFFSITE_* is set in .env; rclone
  # encrypts client-side, so the storage provider only sees ciphertext.
  offsite:
    image: rclone/rclone:1.68
    profiles: ["offsite"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          rclone copy /data/backups secure:backups --max-age 72h --transfers 2
          rclone copy /data/bot/raw secure:raw --max-age 72h --transfers 2
          sleep "$${OFFSITE_INTERVAL_SECONDS:-21600}"
        done
    environment:
      OFFSITE_INTERVAL_SECONDS: ${OFFSITE_INTERVAL_SECONDS:-21600}
      RCLONE_CONFIG_REMOTE_TYPE: s3
      RCLONE_CONFIG_REMOTE_PROVIDER: ${OFFSITE_S3_PROVIDER:-Other}
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      RCLONE_CONFIG_REMOTE_REGION: ${OFFSITE_S3_REGION:-}
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_SECURE_TYPE: crypt
      RCLONE_CONFIG_SECURE_REMOTE: remote:${OFFSITE_S3_BUCKET:-}/solanadvij
      RCLONE_CONFIG_SECURE_PASSWORD: ${OFFSITE_CRYPT_PASSWORD_OBSCURED:-}
    volumes:
      - backups:/data/backups:ro
      - bot-data:/data/bot:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot-data:
  pg-data:
  backups:
